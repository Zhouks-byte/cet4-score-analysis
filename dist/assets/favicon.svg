<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="四级成绩分析">
  <title>四级成绩分析</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b78ff"/>
      <stop offset="52%" stop-color="#5b5bf5"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dcd7ff"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形底：内留约 7% 安全边距，圆角比例贴合 iOS / Android 图标规范 -->
  <rect x="36" y="36" width="440" height="440" rx="112" fill="url(#bg)"/>
  <rect x="36" y="36" width="440" height="440" rx="112" fill="none"
        stroke="#ffffff" stroke-opacity="0.16" stroke-width="7"/>

  <!-- 270° 仪表环，开口朝正下方，环心与画布中心重合（保证严格居中对称） -->
  <g transform="rotate(135 256 256)">
    <!-- 底轨 -->
    <circle cx="256" cy="256" r="158" fill="none"
            stroke="#ffffff" stroke-opacity="0.22"
            stroke-width="42" stroke-linecap="round"
            stroke-dasharray="744.6 248.2"/>
    <!-- 进度弧：约 71%，寓意「向目标推进」 -->
    <circle cx="256" cy="256" r="158" fill="none"
            stroke="url(#ring)"
            stroke-width="42" stroke-linecap="round"
            stroke-dasharray="528 466"/>
  </g>

  <!-- 中心数字 4：与站名呼应；粗字重保证 16px 下仍可辨识。
       位置经实测校正：字形包围盒中心对齐画布中心 (256,256)。 -->
  <text x="252.6" y="339" text-anchor="middle" fill="#ffffff"
        font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif"
        font-size="200" font-weight="800" letter-spacing="-10">4</text>
</svg>
