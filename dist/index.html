<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="keywords" content="英语四级,四级成绩,四级估分,赋分,710分,成绩分析,备考建议">
<meta property="og:type" content="website">
<meta property="og:title" content="四级成绩分析 · CET-4 估分与提分建议">
<meta property="og:description" content="按官方分值结构自动折算 710 分制报道分，可视化趋势与针对性提分建议。">
<meta property="og:locale" content="zh_CN">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><text x='50' y='68' font-size='54' font-weight='700' text-anchor='middle' fill='white' font-family='system-ui,sans-serif'>4</text></svg>">
<style>
/* ==========================================================================
   四级成绩分析 — 样式系统
   移动优先（360px 起） → 平板（≥760px）→ 桌面（≥1080px）
   ========================================================================== */

:root {
  --brand: #4f46e5;
  --brand-2: #7c3aed;
  --brand-ink: #3730a3;
  --c-listening: #0ea5e9;
  --c-reading: #10b981;
  --c-writing: #f59e0b;
  --c-translation: #ec4899;

  --bg: #f4f5fb;
  --bg-grad: radial-gradient(1200px 600px at 50% -10%, #e8e9ff 0%, rgba(244, 245, 251, 0) 60%);
  --card: #ffffff;
  --card-2: #fbfbff;
  --ink: #191c2b;
  --ink-2: #343a4f;
  --muted: #6c7385;
  --line: #e7e9f2;
  --line-2: #eff1f8;
  --ok: #10b981;
  --warn: #f59e0b;
  --bad: #ef4444;
  --shadow: 0 1px 2px rgba(25, 28, 43, .04), 0 8px 24px -12px rgba(25, 28, 43, .16);
  --shadow-lg: 0 2px 6px rgba(25, 28, 43, .05), 0 24px 48px -20px rgba(25, 28, 43, .25);
  --r-xs: 8px;
  --r-sm: 12px;
  --r: 16px;
  --r-lg: 22px;
  --nav-h: 62px;
  --maxw: 860px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Noto Sans SC", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --brand: #818cf8;
    --brand-2: #a78bfa;
    --brand-ink: #c7d2fe;
    --bg: #0d1017;
    --bg-grad: radial-gradient(1200px 600px at 50% -10%, #1a1f3d 0%, rgba(13, 16, 23, 0) 62%);
    --card: #151925;
    --card-2: #191e2c;
    --ink: #f2f4fb;
    --ink-2: #cdd3e4;
    --muted: #8b93a8;
    --line: #232a3b;
    --line-2: #1c2231;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .6);
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, .35), 0 24px 48px -20px rgba(0, 0, 0, .8);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg) var(--bg-grad) no-repeat;
  background-attachment: fixed;
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior-y: none;
}

h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
a { color: var(--brand); }
svg { display: block; }

/* --------------------------------- 布局 --------------------------------- */
.app {
  max-width: var(--maxw);
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.view {
  flex: 1;
  padding: 14px 14px calc(var(--nav-h) + 26px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 12px;
  animation: pageIn .22s ease both;
}

@keyframes pageIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

/* --------------------------------- 顶栏 --------------------------------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
.topbar.is-scrolled { border-bottom-color: var(--line); }

.topbar-inner {
  max-width: calc(var(--maxw) - 28px);
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }

.brand-mark {
  width: 38px; height: 38px;
  flex: none;
  display: grid; place-items: center;
  border-radius: 12px;
  background: linear-gradient(140deg, var(--brand), var(--brand-2));
  color: #fff;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: .5px;
  box-shadow: 0 6px 16px -6px var(--brand);
}

.brand-text { min-width: 0; }
.brand-text h1 {
  font-size: 16.5px;
  font-weight: 700;
  letter-spacing: -.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-text p {
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-meta { display: flex; align-items: center; gap: 6px; flex: none; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  border-radius: 999px;
  background: var(--card);
  border: 1px solid var(--line);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
  white-space: nowrap;
  box-shadow: var(--shadow);
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
.pill.big { font-variant-numeric: tabular-nums; }
.pill.pass { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.pill.fail { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 32%, var(--line)); }

/* --------------------------------- 卡片 --------------------------------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  padding: 16px;
}
.card.tight { padding: 14px; }
.card.flush { padding: 0; overflow: hidden; }

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.card-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -.1px;
  color: var(--ink);
}
.card-title .ico { width: 18px; height: 18px; opacity: .9; }
.card-sub { font-size: 12px; color: var(--muted); font-weight: 500; }

.sec-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 4px 2px 0;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: .2px;
}
.sec-title .hint { font-weight: 500; font-size: 11.5px; color: var(--muted); opacity: .9; }

/* 分区主题色 */
.tone-listening { --tone: var(--c-listening); }
.tone-reading   { --tone: var(--c-reading); }
.tone-writing   { --tone: var(--c-writing); }
.tone-translation { --tone: var(--c-translation); }

.tone-bar {
  display: flex; align-items: center; gap: 8px;
}
.tone-bar.wrap { flex-wrap: wrap; gap: 6px; }
.tone-bar.wrap > * { flex: none; white-space: nowrap; }
.tone-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px 3px 7px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--tone, var(--brand)) 12%, transparent);
  color: var(--tone, var(--brand));
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .2px;
  white-space: nowrap;
}
.tone-chip::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--tone, var(--brand));
}

/* -------------------------------- 分段控件 ------------------------------- */
.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 4px;
  padding: 4px;
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.seg button {
  padding: 9px 6px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  transition: background .18s, color .18s, box-shadow .18s;
  white-space: nowrap;
}
.seg button[aria-selected="true"] {
  background: var(--card);
  color: var(--ink);
  box-shadow: var(--shadow);
}

/* --------------------------------- 录入行 -------------------------------- */
.part {
  padding: 12px 0;
  border-top: 1px dashed var(--line);
}
.part:first-of-type { border-top: 0; padding-top: 4px; }

.part-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.part-name {
  font-size: 13.5px;
  font-weight: 650;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.part-meta {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.part-score {
  text-align: right;
  flex: none;
  font-variant-numeric: tabular-nums;
}
.part-score b { font-size: 15px; font-weight: 750; }
.part-score span { font-size: 11.5px; color: var(--muted); font-weight: 500; }

/* 步进器 */
.stepper {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.step-btn {
  width: 38px; height: 38px;
  flex: none;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card-2);
  color: var(--ink-2);
  display: grid; place-items: center;
  font-size: 20px;
  font-weight: 600;
  line-height: 1;
  transition: transform .12s, background .16s;
  user-select: none;
  touch-action: manipulation;
}
.step-btn:active { transform: scale(.94); background: var(--line-2); }
.step-btn[disabled] { opacity: .38; pointer-events: none; }

.step-val {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 0;
}
.step-val input {
  width: 4.2em;
  min-width: 0;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: 700 17px/1 var(--mono);
  text-align: center;
  padding: 8px 4px;
  border-radius: 10px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
.step-val input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent); }
.step-val input::-webkit-outer-spin-button,
.step-val input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.step-val .of { font-size: 12.5px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }

/* 滑杆 */
.range {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 30px;
  margin: 6px 0 0;
  background: transparent;
  outline: none;
  touch-action: pan-y;
}
.range::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 999px;
  background: linear-gradient(to right, var(--tone, var(--brand)) var(--fill, 0%), var(--line-2) var(--fill, 0%));
}
.range::-moz-range-track {
  height: 6px; border-radius: 999px; background: var(--line-2);
}
.range::-moz-range-progress {
  height: 6px; border-radius: 999px; background: var(--tone, var(--brand));
}
.range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px; height: 22px;
  margin-top: -8px;
  border-radius: 50%;
  background: var(--card);
  border: 2px solid var(--tone, var(--brand));
  box-shadow: 0 2px 8px rgba(0, 0, 0, .16);
  cursor: pointer;
}
.range::-moz-range-thumb {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--card);
  border: 2px solid var(--tone, var(--brand));
  box-shadow: 0 2px 8px rgba(0, 0, 0, .16);
}

.track {
  height: 6px;
  border-radius: 999px;
  background: var(--line-2);
  overflow: hidden;
  margin-top: 8px;
}
.track > i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--tone, var(--brand));
  transition: width .3s cubic-bezier(.22, .61, .36, 1);
}
.track.thin { height: 4px; }
.track.tall { height: 8px; }

/* --------------------------------- 选项芯片 ------------------------------ */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.chip {
  padding: 8px 12px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--card-2);
  font-size: 12.5px;
  font-weight: 650;
  color: var(--ink-2);
  transition: all .16s;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.chip:active { transform: scale(.97); }
.chip[aria-pressed="true"] {
  border-color: color-mix(in srgb, var(--brand) 55%, var(--line));
  background: color-mix(in srgb, var(--brand) 11%, var(--card));
  color: var(--brand-ink);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 10%, transparent);
}
.chip small { display: block; font-size: 10.5px; font-weight: 500; color: var(--muted); }

/* --------------------------------- 徽标 --------------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .2px;
  border: 1px solid transparent;
  white-space: nowrap;
  flex: none;
}
.badge.strong { color: var(--ok); background: color-mix(in srgb, var(--ok) 11%, transparent); border-color: color-mix(in srgb, var(--ok) 26%, transparent); }
.badge.ok     { color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, transparent); border-color: color-mix(in srgb, var(--brand) 24%, transparent); }
.badge.weak   { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 28%, transparent); }
.badge.poor   { color: var(--bad); background: color-mix(in srgb, var(--bad) 11%, transparent); border-color: color-mix(in srgb, var(--bad) 26%, transparent); }
.badge.ghost  { color: var(--muted); background: var(--card-2); border-color: var(--line); }

/* --------------------------------- 按钮 --------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 12px 16px;
  border-radius: 13px;
  font-size: 14px;
  font-weight: 700;
  transition: transform .12s, box-shadow .18s, background .18s;
  border: 1px solid transparent;
}
.btn:active { transform: scale(.985); }
.btn-primary {
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: #fff;
  box-shadow: 0 10px 22px -12px var(--brand);
}
.btn-ghost {
  background: var(--card-2);
  border-color: var(--line);
  color: var(--ink-2);
}
.btn-block { width: 100%; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.btn.sm { padding: 9px 12px; font-size: 12.5px; border-radius: 11px; }

/* ------------------------------ 实时预览条 ------------------------------- */
.preview {
  position: sticky;
  bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom, 0px));
  z-index: 20;
  background: linear-gradient(150deg, color-mix(in srgb, var(--brand) 94%, #000), var(--brand-2));
  color: #fff;
  border-radius: var(--r-lg);
  padding: 14px 16px;
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255, 255, 255, .06) inset;
  overflow: hidden;
}
.preview::after {
  content: "";
  position: absolute;
  inset: -60% -20% auto auto;
  width: 240px; height: 240px;
  background: radial-gradient(circle, rgba(255, 255, 255, .18), transparent 62%);
  pointer-events: none;
}
.preview-top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
}
.pv-label { font-size: 11.5px; font-weight: 600; opacity: .82; letter-spacing: .6px; }
.pv-score {
  display: flex;
  align-items: baseline;
  gap: 4px;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.pv-score b { font-size: 34px; font-weight: 800; letter-spacing: -1px; }
.pv-score span { font-size: 12.5px; opacity: .8; font-weight: 600; }
.pv-right { text-align: right; }
.pv-badge {
  display: inline-block;
  padding: 4px 9px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .17);
  font-size: 11.5px;
  font-weight: 700;
}
.pv-bars {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  margin-top: 11px;
}
.pv-bar { min-width: 0; }
.pv-bar .lbl {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 10.5px; font-weight: 600; opacity: .85; margin-bottom: 4px;
  font-variant-numeric: tabular-nums;
}
.pv-bar .lbl b { font-size: 11.5px; opacity: 1; }
.pv-bar .t { height: 5px; border-radius: 999px; background: rgba(255, 255, 255, .22); overflow: hidden; }
.pv-bar .t > i { display: block; height: 100%; border-radius: 999px; background: #fff; transition: width .3s; }

/* ------------------------------- 统计卡片 -------------------------------- */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.stat {
  padding: 13px 14px;
  border-radius: var(--r);
  background: var(--card-2);
  border: 1px solid var(--line);
  min-width: 0;
}
.stat .k { font-size: 11.5px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.stat .v {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -.6px;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
  line-height: 1.2;
}
.stat .v small { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.stat .d { font-size: 11.5px; font-weight: 650; margin-top: 2px; }
.up { color: var(--ok); }
.down { color: var(--bad); }
.flat { color: var(--muted); }

/* --------------------------------- 图表 --------------------------------- */
.chart-wrap {
  position: relative;
  width: 100%;
  touch-action: pan-y;
  user-select: none;
}
.chart-wrap svg { width: 100%; height: auto; }
.chart-empty {
  display: grid;
  place-items: center;
  height: 180px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
  padding: 0 20px;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  margin-top: 10px;
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 600;
}
.legend .lg { display: inline-flex; align-items: center; gap: 5px; }
.legend .lg i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.legend button { display: inline-flex; align-items: center; gap: 5px; opacity: 1; }
.legend button[aria-pressed="false"] { opacity: .38; }
.chart-tip {
  position: absolute;
  z-index: 5;
  pointer-events: none;
  transform: translate(-50%, -112%);
  background: color-mix(in srgb, var(--ink) 92%, transparent);
  color: #fff;
  padding: 7px 10px;
  border-radius: 10px;
  font-size: 11.5px;
  line-height: 1.5;
  white-space: nowrap;
  box-shadow: 0 8px 20px -8px rgba(0, 0, 0, .5);
  opacity: 0;
  transition: opacity .12s;
}
.chart-tip.show { opacity: 1; }
.chart-tip b { font-size: 13px; }
.chart-tip .muted { opacity: .72; }

/* --------------------------------- 记录列表 ------------------------------ */
.rec {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 12px 14px;
  border-top: 1px solid var(--line-2);
}
.rec:first-child { border-top: 0; }
.rec-dot {
  width: 4px; height: 34px; border-radius: 999px; flex: none;
  background: linear-gradient(to bottom, var(--brand), var(--brand-2));
}
.rec-main { flex: 1; min-width: 0; }
.rec-title {
  display: flex; align-items: center; gap: 7px;
  font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.rec-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; font-variant-numeric: tabular-nums; }
.rec-del {
  width: 34px; height: 34px; flex: none;
  border-radius: 10px;
  display: grid; place-items: center;
  color: var(--muted);
  border: 1px solid var(--line);
  background: var(--card-2);
}
.rec-del:active { color: var(--bad); }

/* --------------------------------- 分析 --------------------------------- */
.hero {
  display: flex;
  align-items: center;
  gap: 16px;
}
.ring { position: relative; width: 104px; height: 104px; flex: none; }
.ring svg { width: 100%; height: 100%; }
.ring .ring-txt {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.ring .ring-txt b { font-size: 27px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
.ring .ring-txt span { font-size: 10.5px; color: var(--muted); font-weight: 600; }
.hero-main { min-width: 0; flex: 1; }
.hero-title { font-size: 17px; font-weight: 750; letter-spacing: -.2px; }
.hero-desc { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

.diag {
  display: grid;
  gap: 8px;
}
.diag-item {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  background: var(--card-2);
  border: 1px solid var(--line);
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--ink-2);
}
.diag-item .di { font-size: 15px; line-height: 1.2; flex: none; }
.diag-item b { color: var(--ink); }

.plan-list { display: grid; gap: 9px; }
.plan-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 12px;
  border-radius: var(--r-sm);
  background: var(--card-2);
  border: 1px solid var(--line);
}
.plan-n {
  width: 24px; height: 24px; border-radius: 8px; flex: none;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--brand) 12%, transparent);
  color: var(--brand-ink);
  font-size: 12px; font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.plan-main { flex: 1; min-width: 0; }
.plan-title { font-size: 13px; font-weight: 650; }
.plan-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.plan-gain { font-size: 13px; font-weight: 800; color: var(--ok); font-variant-numeric: tabular-nums; flex: none; }

.advice { display: grid; gap: 6px; margin-top: 10px; }
.advice li {
  position: relative;
  padding-left: 16px;
  font-size: 12.5px;
  line-height: 1.62;
  color: var(--ink-2);
}
.advice li::before {
  content: "";
  position: absolute;
  left: 3px; top: .58em;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--tone, var(--brand));
  opacity: .75;
}

details.acc {
  border-top: 1px solid var(--line-2);
  padding: 10px 0 0;
}
details.acc > summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 2px 0;
  font-size: 13px;
  font-weight: 650;
}
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary .caret {
  margin-left: auto;
  width: 18px; height: 18px;
  flex: none;
  color: var(--muted);
  transition: transform .2s;
}
details.acc[open] > summary .caret { transform: rotate(180deg); }
details.acc .acc-body { padding-top: 8px; }

/* --------------------------------- 表格 --------------------------------- */
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 8px 5px; text-align: right; border-bottom: 1px solid var(--line-2); }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl thead th { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl td.acc { font-weight: 700; }

@media (max-width: 359px) {
  .tbl { font-size: 11.5px; }
  .tbl th, .tbl td { padding: 7px 3px; }
}

/* --------------------------------- 表单 --------------------------------- */
.field { display: grid; gap: 6px; }
.field > label { font-size: 12.5px; font-weight: 650; color: var(--ink-2); }
.field .hint { font-size: 11.5px; color: var(--muted); }
.input {
  width: 100%;
  padding: 11px 13px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card-2);
  color: var(--ink);
  font: 500 15px/1.4 var(--font);
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color .16s, box-shadow .16s;
}
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 15%, transparent); }
.input::placeholder { color: var(--muted); opacity: .75; }
textarea.input { resize: vertical; min-height: 62px; font-size: 14px; }
select.input { padding-right: 34px; }

.form-grid { display: grid; gap: 12px; }
@media (min-width: 760px) { .form-grid.two { grid-template-columns: 1fr 1fr; } }

/* --------------------------------- 空状态 -------------------------------- */
.empty {
  text-align: center;
  padding: 26px 18px;
  color: var(--muted);
}
.empty .em-ico {
  width: 56px; height: 56px;
  margin: 0 auto 10px;
  border-radius: 18px;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--brand) 10%, transparent);
  color: var(--brand);
}
.empty h3 { font-size: 14.5px; color: var(--ink); margin-bottom: 4px; }
.empty p { font-size: 12.5px; line-height: 1.6; }
.empty .btn { margin-top: 14px; }

/* --------------------------------- 底部导航 ------------------------------ */
.tabbar {
  position: fixed;
  left: 50%;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 40;
  width: min(calc(100% - 20px), 460px);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
  padding: 6px;
  border-radius: 20px;
  background: color-mix(in srgb, var(--card) 88%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(18px);
  backdrop-filter: saturate(180%) blur(18px);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
}
.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 7px 4px 6px;
  border-radius: 14px;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 650;
  transition: color .18s, background .18s;
}
.tab .ico { width: 21px; height: 21px; }
.tab[aria-selected="true"] {
  color: #fff;
  background: linear-gradient(140deg, var(--brand), var(--brand-2));
  box-shadow: 0 8px 18px -10px var(--brand);
}
.tab[aria-selected="true"] .ico { opacity: 1; }

/* --------------------------------- Toast -------------------------------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h) + 34px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 10px);
  z-index: 60;
  max-width: min(90vw, 420px);
  padding: 11px 16px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--ink) 94%, transparent);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* --------------------------------- 说明 --------------------------------- */
.note {
  font-size: 12px;
  line-height: 1.68;
  color: var(--muted);
}
.note b { color: var(--ink-2); }
.note + .note { margin-top: 8px; }
.divider { height: 1px; background: var(--line); margin: 14px 0; }

.kbd {
  font: 600 11.5px var(--mono);
  padding: 1px 5px;
  border-radius: 5px;
  background: var(--line-2);
  color: var(--ink-2);
}

/* --------------------------------- 响应式 -------------------------------- */
@media (min-width: 760px) {
  body { font-size: 15.5px; }
  .view { padding: 18px 20px calc(var(--nav-h) + 34px + env(safe-area-inset-bottom, 0px)); gap: 14px; }
  .topbar { padding-left: 20px; padding-right: 20px; }
  .brand-mark { width: 42px; height: 42px; font-size: 21px; }
  .brand-text h1 { font-size: 19px; }
  .brand-text p { font-size: 12.5px; }
  .card { padding: 20px; border-radius: 24px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .stat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .preview { padding: 18px 20px; }
  .pv-score b { font-size: 42px; }
  .pv-bars { gap: 12px; }
  .ring { width: 128px; height: 128px; }
  .ring .ring-txt b { font-size: 32px; }
  .hero-title { font-size: 19px; }
  .tabbar { width: 520px; }
}

@media (min-width: 1080px) {
  :root { --maxw: 920px; }
  .brand-text h1 { font-size: 20px; }
}

@media (max-width: 359px) {
  .view { padding-left: 10px; padding-right: 10px; }
  .card { padding: 13px; }
  .brand-text p { display: none; }
  .pv-score b { font-size: 29px; }
  .stat .v { font-size: 19px; }
  .step-btn { width: 34px; height: 34px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* 打印 */
@media print {
  .tabbar, .preview, .topbar-meta { display: none !important; }
  body { background: #fff; }
  .card { box-shadow: none; border-color: #ddd; }
}

</style>

</div>

<script>
/*!
 * model.js — 四级（CET-4）成绩赋分估算核心引擎
 * ------------------------------------------------------------------
 * 分值结构来源：《英语考试应试指南》第一章 第 3 问（官方试卷结构表）
 *   写作      1 题  15%
 *   听力      短篇新闻 7 题 7% / 长对话 8 题 8% / 听力篇章 10 题 20%   （共 25 题 35%）
 *   阅读      词汇理解 10 题 5% / 长篇阅读 10 题 10% / 仔细阅读 10 题 20%（共 30 题 35%）
 *   翻译      1 题  15%
 *   合计 57 题 / 100% / 125 分钟
 * 赋分规则：
 *   1) 各部分按官方"分值比例"折算为百分制原始分；写作、翻译按 15 分制（恰等于其 15 点百分制）；
 *   2) 百分制原始分 × 7.1 = 710 分制报道分（线性赋分参考值，710 / 100 = 7.1）；
 *   3) 官方报道分实为常模转换所得（常模均值 500、标准差 70），故额外给出正态近似的常模百分位；
 *   4) 官方规则：总分 220 分及以下记 0 分、不发放成绩报告单；425 分及以上达到"基本目标"。
 * ------------------------------------------------------------------
 * 本文件不依赖 DOM，可同时用于浏览器与 Node（测试）。
 */
(function (root) {
  'use strict';

  /* ============================== 常量 ============================== */

  var FULL_SCORE = 710;          // 报道总分满分
  var RAW_FULL = 100;            // 百分制加权原始分满分
  var POINT = FULL_SCORE / RAW_FULL;  // 7.1：百分制 1 分 = 报道分 7.1 分
  var PASS_LINE = 425;           // 官方"基本目标"线
  var REPORT_FLOOR = 220;        // 220 分及以下：官方记 0 分 / 不发成绩报告单
  var NORM_MEAN = 500;           // 常模均值
  var NORM_SD = 70;              // 常模标准差
  var SUBJECTIVE_FULL = 15;      // 写作 / 翻译 15 分制

  /* 官方五档总体印象评分（写作、翻译通用档位划分） */
  var TIERS = [
    { key: 't14', label: '14分档', min: 13, max: 15, anchor: 14 },
    { key: 't11', label: '11分档', min: 10, max: 12, anchor: 11 },
    { key: 't8',  label: '8分档',  min: 7,  max: 9,  anchor: 8  },
    { key: 't5',  label: '5分档',  min: 4,  max: 6,  anchor: 5  },
    { key: 't2',  label: '2分档',  min: 1,  max: 3,  anchor: 2  }
  ];

  /* 分数段（用于展示与建议分档，标签由 content.js 提供文案） */
  var BANDS = [
    { key: 'b_under', min: 0,   max: 424 },
    { key: 'b_pass',  min: 425, max: 499 },
    { key: 'b_fair',  min: 500, max: 549 },
    { key: 'b_good',  min: 550, max: 599 },
    { key: 'b_great', min: 600, max: 649 },
    { key: 'b_top',   min: 650, max: 710 }
  ];

  /* 试卷结构：客观题型按官方题量与每题分值比例（百分制）定义 */
  var SECTIONS = [
    {
      key: 'writing', label: '写作', short: '写作', ratio: 15, kind: 'subjective',
      tierType: 'writing', order: 1, minutes: 30,
      parts: [
        { key: 'writing', label: '短文写作', short: '作文', count: 1, perRatio: 15 }
      ]
    },
    {
      key: 'listening', label: '听力理解', short: '听力', ratio: 35, kind: 'objective',
      order: 2, minutes: 25,
      parts: [
        { key: 'news',     label: '短篇新闻', short: '新闻',   count: 7,  perRatio: 1, tip: '3 篇新闻：前两篇各 2 题，第三篇 3 题' },
        { key: 'longconv', label: '长对话',   short: '长对话', count: 8,  perRatio: 1, tip: '2 篇长对话，每篇各 4 题' },
        { key: 'passage',  label: '听力篇章', short: '篇章',   count: 10, perRatio: 2, tip: '3 篇短文：4+3+3 题，每题分值最高' }
      ]
    },
    {
      key: 'reading', label: '阅读理解', short: '阅读', ratio: 35, kind: 'objective',
      order: 3, minutes: 40,
      parts: [
        { key: 'banked',   label: '词汇理解（选词填空）', short: '选词', count: 10, perRatio: 0.5, tip: '1 篇 200~250 词短文，10 空、15 备选词' },
        { key: 'matching', label: '长篇阅读（段落匹配）', short: '匹配', count: 10, perRatio: 1,   tip: '约 1000 词长文，10 句信息匹配' },
        { key: 'careful',  label: '仔细阅读', short: '仔细', count: 10, perRatio: 2,   tip: '2 篇 300~350 词短文，每篇 5 题' }
      ]
    },
    {
      key: 'translation', label: '翻译', short: '翻译', ratio: 15, kind: 'subjective',
      tierType: 'translation', order: 4, minutes: 30,
      parts: [
        { key: 'translation', label: '汉译英段落翻译', short: '翻译', count: 1, perRatio: 15 }
      ]
    }
  ];

  var SECTION_MAP = {};
  var PART_LIST = [];   // 全部客观题小项（6 个）
  var PART_MAP = {};
  SECTIONS.forEach(function (sec) {
    SECTION_MAP[sec.key] = sec;
    sec.reportMax = round1(sec.ratio * POINT);
    sec.rawMax = sec.ratio;
    sec.parts.forEach(function (part) {
      part.section = sec.key;
      part.sectionLabel = sec.label;
      part.rawMax = round2(part.count * part.perRatio);
      part.reportMax = round1(part.count * part.perRatio * POINT);
      part.perItem = part.perRatio * POINT;          // 每答对 1 题 ≈ 报道分
      PART_MAP[part.key] = part;
      if (sec.kind === 'objective') PART_LIST.push(part);
    });
  });

  /* ============================== 工具 ============================== */

  function clamp(n, lo, hi) {
    n = Number(n);
    if (!isFinite(n)) return 0;
    return Math.min(hi, Math.max(lo, n));
  }
  function clampInt(n, lo, hi) {
    return Math.round(clamp(n, lo, hi));
  }
  function round1(n) { return Math.round((Number(n) || 0) * 10) / 10; }
  function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
  function round0(n) { return Math.round(Number(n) || 0); }

  /** 误差函数（Abramowitz & Stegun 7.1.26，绝对误差 < 1.5e-7） */
  function erf(x) {
    var sign = x < 0 ? -1 : 1;
    x = Math.abs(x);
    var a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741,
        a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
    var t = 1 / (1 + p * x);
    var y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
    return sign * y;
  }

  /** 标准正态分布 CDF */
  function normalCdf(z) {
    return 0.5 * (1 + erf(z / Math.SQRT2));
  }

  /** 报道分 → 常模百分位（0~100，正态近似） */
  function percentileOf(reportScore, mean, sd) {
    mean = mean == null ? NORM_MEAN : mean;
    sd = sd == null ? NORM_SD : sd;
    var p = normalCdf((Number(reportScore) - mean) / sd) * 100;
    return Math.min(100, Math.max(0, round1(p)));
  }

  /** 报道分 → 分数段 */
  function bandOf(reportScore) {
    var s = Number(reportScore) || 0;
    for (var i = 0; i < BANDS.length; i++) {
      if (s >= BANDS[i].min && s <= BANDS[i].max) return BANDS[i];
    }
    return s < 0 ? BANDS[0] : BANDS[BANDS.length - 1];
  }

  /** 15 分制得分 → 档位 */
  function tierOf(score) {
    var s = clamp(score, 0, SUBJECTIVE_FULL);
    if (s >= 13) return TIERS[0];
    if (s >= 10) return TIERS[1];
    if (s >= 7) return TIERS[2];
    if (s >= 4) return TIERS[3];
    if (s >= 1) return TIERS[4];
