<style>
/* ==========================================================================
   四级成绩分析 — 设计系统 v2
   目标：更清晰的视觉层级、更合理的空间利用（平板/桌面双栏）、更顺的交互反馈
   断点：360（小手机）→ 420 → 760（平板双栏）→ 1080（桌面）
   ========================================================================== */

/* ------------------------------ 设计令牌 ------------------------------ */
:root {
  /* 品牌 */
  --brand: #5b5bf5;
  --brand-2: #8b5cf6;
  --brand-ink: #3730a3;
  --brand-soft: #eef0ff;

  /* 四板块语义色（图表/徽标统一引用） */
  --c-listening: #3b82f6;
  --c-reading: #10b981;
  --c-writing: #f59e0b;
  --c-translation: #ec4899;

  /* 中性 */
  --bg: #f6f7fb;
  --bg-grad: radial-gradient(900px 500px at 50% -8%, #e9eaff 0%, rgba(246, 247, 251, 0) 62%);
  --card: #ffffff;
  --card-2: #f8f9fd;
  --card-3: #f1f3fa;
  --ink: #14161f;
  --ink-2: #333849;
  --muted: #6b7286;
  --muted-2: #8d93a5;
  --line: #e8eaf3;
  --line-2: #f0f2f9;

  /* 语义 */
  --ok: #0ea672;
  --warn: #e08b00;
  --bad: #e5484d;
  --ok-soft: #e7f8f1;
  --warn-soft: #fdf3e3;
  --bad-soft: #fdecec;

  /* 阴影：分层更细，避免"发灰" */
  --sh-1: 0 1px 2px rgba(20, 22, 31, .04);
  --sh-2: 0 1px 2px rgba(20, 22, 31, .04), 0 4px 12px -6px rgba(20, 22, 31, .10);
  --sh-3: 0 2px 4px rgba(20, 22, 31, .04), 0 12px 28px -12px rgba(20, 22, 31, .16);
  --sh-pop: 0 24px 56px -20px rgba(20, 22, 31, .34);

  /* 圆角 */
  --r-xs: 8px;
  --r-sm: 11px;
  --r: 14px;
  --r-md: 18px;
  --r-lg: 24px;
  --r-pill: 999px;

  /* 尺寸 */
  --nav-h: 66px;
  --maxw: 1180px;
  --gap: 12px;
  --pad: 14px;

  --ease: cubic-bezier(.22, .68, .36, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Noto Sans SC", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --brand: #818cf8;
    --brand-2: #a78bfa;
    --brand-ink: #c7d2fe;
    --brand-soft: #1b1f36;

    --c-listening: #60a5fa;
    --c-reading: #34d399;
    --c-writing: #fbbf24;
    --c-translation: #f472b6;

    --bg: #0b0d14;
    --bg-grad: radial-gradient(900px 520px at 50% -8%, #171b33 0%, rgba(11, 13, 20, 0) 64%);
    --card: #13151f;
    --card-2: #181b26;
    --card-3: #1e2230;
    --ink: #f2f4fa;
    --ink-2: #c9cee0;
    --muted: #8b92a8;
    --muted-2: #6f7689;
    --line: #232838;
    --line-2: #1b1f2b;

    --ok: #34d399;
    --warn: #fbbf24;
    --bad: #f87171;
    --ok-soft: #10281f;
    --warn-soft: #2a2210;
    --bad-soft: #2b1618;

    --sh-1: 0 1px 2px rgba(0, 0, 0, .4);
    --sh-2: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px -8px rgba(0, 0, 0, .7);
    --sh-3: 0 2px 4px rgba(0, 0, 0, .4), 0 14px 32px -16px rgba(0, 0, 0, .85);
    --sh-pop: 0 24px 56px -20px rgba(0, 0, 0, .95);
  }
}

/* ------------------------------ 基础 ------------------------------ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.58;
  color: var(--ink);
  background: var(--bg) var(--bg-grad) no-repeat fixed;
  min-height: 100dvh;
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-variant-numeric: tabular-nums;
}

h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
a { color: var(--brand); }
svg { display: block; }

::selection { background: color-mix(in srgb, var(--brand) 22%, transparent); }

/* 焦点可见性（键盘无障碍） */
:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: 6px;
}

/* ------------------------------ 骨架 ------------------------------ */
.app {
  max-width: var(--maxw);
  margin: 0 auto;
  min-height: 100dvh;
}

.view {
  padding: var(--pad) var(--pad) calc(var(--nav-h) + 30px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  animation: viewIn .26s var(--ease-out) both;
}

@keyframes viewIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* 卡片入场：错峰淡入 */
.view > section { animation: cardIn .32s var(--ease-out) both; }
.view > section:nth-child(1) { animation-delay: .01s; }
.view > section:nth-child(2) { animation-delay: .04s; }
.view > section:nth-child(3) { animation-delay: .07s; }
.view > section:nth-child(4) { animation-delay: .10s; }
.view > section:nth-child(5) { animation-delay: .13s; }
.view > section:nth-child(n+6) { animation-delay: .16s; }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px) scale(.995); }
  to { opacity: 1; transform: none; }
}

/* ------------------------------ 顶栏 ------------------------------ */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  padding: calc(9px + env(safe-area-inset-top, 0px)) var(--pad) 9px;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid transparent;
  transition: border-color .22s var(--ease), background .22s var(--ease);
}
.topbar.is-scrolled {
  border-bottom-color: var(--line);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
}

.topbar-inner {
  max-width: calc(var(--maxw) - var(--pad) * 2);
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }

.brand-mark {
  width: 36px; height: 36px;
  flex: none;
  display: grid; place-items: center;
  border-radius: 11px;
  background: linear-gradient(145deg, var(--brand), var(--brand-2));
  color: #fff;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -.5px;
  box-shadow: 0 5px 14px -6px var(--brand), inset 0 1px 0 rgba(255, 255, 255, .28);
}

.brand-text { min-width: 0; }
.brand-text h1 {
  font-size: 16px;
  font-weight: 750;
  letter-spacing: -.3px;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-text p {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-meta { display: flex; align-items: center; gap: 6px; flex: none; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: var(--r-pill);
  background: var(--card);
  border: 1px solid var(--line);
  font-size: 11.5px;
  font-weight: 650;
  color: var(--ink-2);
  white-space: nowrap;
  box-shadow: var(--sh-1);
  transition: transform .18s var(--ease);
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
.pill.big {
  font-size: 13px;
  font-weight: 800;
  padding: 5px 11px;
  letter-spacing: -.2px;
}
.pill.pass { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 34%, var(--line)); background: var(--ok-soft); }
.pill.fail { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, var(--line)); background: var(--bad-soft); }

/* ------------------------------ 卡片 ------------------------------ */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: var(--sh-2);
  padding: 16px;
}
.card.flush { padding: 0; overflow: hidden; }
.card.pad-sm { padding: 13px; }
.card.tinted {
  background: linear-gradient(165deg, var(--card), var(--card-2));
}

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 13px;
}
.card-head.tight { margin-bottom: 9px; }

.card-title {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -.15px;
  color: var(--ink);
}
.card-title .ico { width: 17px; height: 17px; flex: none; color: var(--brand); opacity: .95; }
.card-sub {
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 550;
  white-space: nowrap;
  flex: none;
}

/* 区块小标题 */
.sec-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 14px 0 8px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .3px;
  color: var(--muted);
}
.sec-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line-2);
}

/* ------------------------------ 分区主题 ------------------------------ */
.tone-listening { --tone: var(--c-listening); }
.tone-reading { --tone: var(--c-reading); }
.tone-writing { --tone: var(--c-writing); }
.tone-translation { --tone: var(--c-translation); }

.tone-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px 3px 7px;
  border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--tone, var(--brand)) 13%, transparent);
  color: color-mix(in srgb, var(--tone, var(--brand)) 82%, var(--ink));
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1px;
  white-space: nowrap;
  flex: none;
}
.tone-chip::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--tone, var(--brand));
  flex: none;
}

/* ------------------------------ 分段控件 ------------------------------ */
.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 3px;
  padding: 3px;
  background: var(--card-3);
  border-radius: 12px;
}
.seg button {
  position: relative;
  padding: 8px 6px;
  border-radius: 9px;
  font-size: 12.5px;
  font-weight: 650;
  color: var(--muted);
  transition: color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
}
.seg button[aria-selected="true"] {
  background: var(--card);
  color: var(--ink);
  box-shadow: var(--sh-2);
}
.seg button:active { transform: scale(.985); }

/* ------------------------------ 录入行 ------------------------------ */
.part {
  position: relative;
  padding: 12px 0;
  border-top: 1px solid var(--line-2);
}
.part:first-of-type { border-top: 0; padding-top: 2px; }

.part-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  min-width: 0;
}
.part-name {
  font-size: 13.5px;
  font-weight: 680;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  line-height: 1.4;
}
.part-meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  line-height: 1.45;
}
.part-score { text-align: right; flex: none; }
.part-score b {
  font-size: 16px;
  font-weight: 780;
  letter-spacing: -.4px;
  font-variant-numeric: tabular-nums;
  transition: color .2s var(--ease);
}
.part-score > span { font-size: 11px; color: var(--muted); font-weight: 550; }

/* 步进器：更易点、反馈更明确 */
.stepper {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.step-btn {
  width: 40px; height: 40px;
  flex: none;
  border-radius: 12px;
  border: 1.5px solid color-mix(in srgb, var(--ink) 12%, var(--line));
  background: var(--card);
  color: var(--ink);
  display: grid; place-items: center;
  font-size: 19px;
  font-weight: 700;
  line-height: 1;
  user-select: none;
  touch-action: manipulation;
  box-shadow: var(--sh-1);
  transition: transform .12s var(--ease), background .16s var(--ease), border-color .16s var(--ease), box-shadow .16s var(--ease), color .16s var(--ease);
}
.step-btn:hover {
  background: color-mix(in srgb, var(--tone, var(--brand)) 7%, var(--card));
  border-color: color-mix(in srgb, var(--tone, var(--brand)) 45%, var(--line));
  color: var(--tone, var(--brand));
}
.step-btn:active {
  transform: scale(.92);
  background: color-mix(in srgb, var(--tone, var(--brand)) 13%, var(--card));
  border-color: var(--tone, var(--brand));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone, var(--brand)) 12%, transparent);
}
.step-btn[disabled] {
  opacity: .3;
  pointer-events: none;
  box-shadow: none;
  border-color: var(--line);
  background: var(--card-2);
}

.step-val {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 0;
}
.step-val input {
  width: 3.6em;
  min-width: 0;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: 750 17px/1 var(--mono);
  text-align: center;
  padding: 7px 3px;
  border-radius: 10px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease);
}
.step-val input:focus {
  border-color: var(--tone, var(--brand));
  background: color-mix(in srgb, var(--tone, var(--brand)) 5%, var(--card));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone, var(--brand)) 14%, transparent);
}
.step-val input::-webkit-outer-spin-button,
.step-val input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.step-val .of { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }

/* 滑杆 */
.range {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 32px;
  margin: 4px 0 0;
  background: transparent;
  outline: none;
  touch-action: pan-y;
  cursor: pointer;
}
.range::-webkit-slider-runnable-track {
  height: 7px;
  border-radius: var(--r-pill);
  background: linear-gradient(to right, var(--tone, var(--brand)) var(--fill, 0%), var(--card-3) var(--fill, 0%));
}
.range::-moz-range-track { height: 7px; border-radius: var(--r-pill); background: var(--card-3); }
.range::-moz-range-progress { height: 7px; border-radius: var(--r-pill); background: var(--tone, var(--brand)); }
.range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px; height: 24px;
  margin-top: -8.5px;
  border-radius: 50%;
  background: var(--card);
  border: 2.5px solid var(--tone, var(--brand));
  box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
  transition: transform .14s var(--ease);
}
.range:active::-webkit-slider-thumb { transform: scale(1.12); }
.range::-moz-range-thumb {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--card);
  border: 2.5px solid var(--tone, var(--brand));
  box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
}

/* 进度条 */
.track {
  height: 7px;
  border-radius: var(--r-pill);
  background: var(--card-3);
  overflow: hidden;
  margin-top: 8px;
}
.track > i {
  display: block;
  height: 100%;
  border-radius: var(--r-pill);
  background: linear-gradient(90deg,
    color-mix(in srgb, var(--tone, var(--brand)) 78%, #fff),
    var(--tone, var(--brand)));
  transition: width .42s var(--ease-out);
}
.track.thin { height: 5px; }

/* ------------------------------ 芯片 ------------------------------ */
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  padding: 7px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card-2);
  font-size: 12.5px;
  font-weight: 650;
  color: var(--ink-2);
  white-space: nowrap;
  transition: all .16s var(--ease);
}
.chip small { display: block; font-size: 10px; font-weight: 500; color: var(--muted); margin-top: 1px; }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] {
  border-color: color-mix(in srgb, var(--brand) 52%, var(--line));
  background: color-mix(in srgb, var(--brand) 10%, var(--card));
  color: var(--brand-ink);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 10%, transparent);
}

/* ------------------------------ 徽标 ------------------------------ */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .1px;
  border: 1px solid transparent;
  white-space: nowrap;
  flex: none;
}
.badge.strong { color: var(--ok); background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 24%, transparent); }
.badge.ok     { color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, transparent); border-color: color-mix(in srgb, var(--brand) 22%, transparent); }
.badge.weak   { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 26%, transparent); }
.badge.poor   { color: var(--bad); background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 24%, transparent); }
.badge.ghost  { color: var(--muted); background: var(--card-2); border-color: var(--line); }

/* ------------------------------ 按钮 ------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 11px 16px;
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 700;
  border: 1px solid transparent;
  transition: transform .12s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease);
  position: relative;
  overflow: hidden;
  white-space: nowrap;
}
.btn:active { transform: scale(.975); }
.btn .ico { width: 17px; height: 17px; flex: none; }
.btn-primary {
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: #fff;
  box-shadow: 0 8px 20px -10px var(--brand), inset 0 1px 0 rgba(255, 255, 255, .22);
}
.btn-primary:hover { box-shadow: 0 10px 26px -10px var(--brand); }
.btn-ghost {
  background: var(--card);
  border-color: var(--line);
  color: var(--ink-2);
  box-shadow: var(--sh-1);
}
.btn-ghost:hover { background: var(--card-2); border-color: color-mix(in srgb, var(--ink) 14%, var(--line)); }
.btn-block { width: 100%; }
.btn-row { display: flex; gap: 9px; }
.btn-row .btn { flex: 1; }
.btn.sm { padding: 7px 11px; font-size: 12px; border-radius: 10px; }
.btn.sm .ico { width: 15px; height: 15px; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 26%, var(--line)); background: var(--bad-soft); }

/* ------------------------------ 实时预览条（录入页） ------------------------------ */
.preview {
  position: sticky;
  bottom: calc(var(--nav-h) + 10px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  border-radius: var(--r-md);
  padding: 13px 15px;
  color: #fff;
  background: linear-gradient(150deg, color-mix(in srgb, var(--brand) 92%, #000), var(--brand-2));
  box-shadow: var(--sh-3), 0 0 0 1px rgba(255, 255, 255, .07) inset;
  overflow: hidden;
}
.preview::after {
  content: "";
  position: absolute;
  inset: -70% -10% auto auto;
  width: 230px; height: 230px;
  background: radial-gradient(circle, rgba(255, 255, 255, .2), transparent 62%);
  pointer-events: none;
}
.preview-top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  position: relative;
}
.pv-label { font-size: 11px; font-weight: 600; opacity: .82; letter-spacing: .3px; }
.pv-score {
  display: flex;
  align-items: baseline;
  gap: 4px;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
.pv-score b {
  font-size: 32px;
  font-weight: 820;
  letter-spacing: -1.2px;
  transition: transform .2s var(--ease-out);
}
.pv-score b.bump { animation: bump .32s var(--ease-out); }
@keyframes bump {
  0% { transform: scale(1); }
  45% { transform: scale(1.055); }
  100% { transform: scale(1); }
}
.pv-score span { font-size: 12px; opacity: .78; font-weight: 650; }
.pv-right { text-align: right; flex: none; }
.pv-badge {
  display: inline-block;
  padding: 3px 9px;
  border-radius: var(--r-pill);
  background: rgba(255, 255, 255, .18);
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.pv-bars {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 10px;
  position: relative;
}
.pv-bar { min-width: 0; }
.pv-bar .lbl {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 4px;
  font-size: 10px;
  font-weight: 600;
  opacity: .88;
  margin-bottom: 4px;
  white-space: nowrap;
}
.pv-bar .lbl b { font-size: 11px; font-weight: 750; }
.pv-bar .t { height: 4px; border-radius: var(--r-pill); background: rgba(255, 255, 255, .22); overflow: hidden; }
.pv-bar .t > i { display: block; height: 100%; border-radius: var(--r-pill); background: #fff; transition: width .4s var(--ease-out); }

/* ------------------------------ 统计 ------------------------------ */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}
.stat {
  padding: 12px 13px;
  border-radius: var(--r);
  background: var(--card-2);
  border: 1px solid var(--line-2);
  min-width: 0;
  transition: border-color .2s var(--ease), background .2s var(--ease);
}
.stat:hover { border-color: var(--line); background: var(--card); }
.stat .k { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.stat .v {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -.8px;
  margin-top: 2px;
  line-height: 1.15;
}
.stat .v small { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 2px; }
.stat .d { font-size: 11px; font-weight: 650; margin-top: 2px; }
.up { color: var(--ok); }
.down { color: var(--bad); }
.flat { color: var(--muted); }

/* ------------------------------ 图表 ------------------------------ */
.chart-wrap {
  position: relative;
  width: 100%;
  touch-action: pan-y;
  user-select: none;
}
.chart-wrap svg { width: 100%; height: auto; overflow: visible; }
.chart-empty {
  display: grid;
  place-items: center;
  height: 170px;
  color: var(--muted);
  font-size: 12.5px;
  text-align: center;
  padding: 0 18px;
}

/* 图表入场动画：只做透明度和位移，绝不改变几何尺寸
   （之前用 scaleY 会让柱子在动画中途视觉上被压扁） */
.c-line { animation: drawIn .95s var(--ease-out) both; }
@keyframes drawIn { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

.c-dot { animation: dotIn .42s var(--ease-out) both; }
@keyframes dotIn { from { opacity: 0; } to { opacity: 1; } }

.c-bar { animation: barIn .46s var(--ease-out) both; }
@keyframes barIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.c-seg { animation: segIn .6s var(--ease-out) both; }
@keyframes segIn { from { opacity: 0; } to { opacity: 1; } }

.c-gauge { animation: gaugeIn .8s var(--ease-out) both; }
@keyframes gaugeIn { from { opacity: 0; } to { opacity: 1; } }

/* resize 重绘时关闭入场动画，避免闪烁 */
.no-anim .c-line,
.no-anim .c-dot,
.no-anim .c-bar,
.no-anim .c-seg,
.no-anim .c-gauge { animation: none !important; }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  margin-top: 9px;
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
}
.legend .lg { display: inline-flex; align-items: center; gap: 5px; }
.legend .lg i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.legend button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 7px 3px 5px;
  border-radius: var(--r-pill);
  transition: opacity .18s var(--ease), background .18s var(--ease);
}
.legend button:hover { background: var(--card-3); }
.legend button[aria-pressed="false"] { opacity: .35; }
.legend button i { width: 9px; height: 9px; border-radius: 3px; flex: none; }

.chart-tip {
  position: absolute;
  z-index: 8;
  pointer-events: none;
  transform: translate(-50%, -114%);
  background: color-mix(in srgb, var(--ink) 94%, transparent);
  color: #fff;
  padding: 6px 10px;
  border-radius: 9px;
  font-size: 11.5px;
  line-height: 1.5;
  white-space: nowrap;
  box-shadow: var(--sh-3);
  opacity: 0;
  transition: opacity .13s var(--ease), transform .13s var(--ease);
}
.chart-tip.show { opacity: 1; transform: translate(-50%, -118%); }
.chart-tip b { font-size: 12.5px; }

/* ------------------------------ 记录列表 ------------------------------ */
.rec {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 14px;
  border-top: 1px solid var(--line-2);
  transition: background .18s var(--ease);
}
.rec:first-child { border-top: 0; }
.rec:hover { background: var(--card-2); }
.rec-dot {
  width: 3px;
  align-self: stretch;
  min-height: 30px;
  border-radius: var(--r-pill);
  flex: none;
}
.rec-main { flex: 1; min-width: 0; }
.rec-title {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13.5px;
  font-weight: 750;
  letter-spacing: -.2px;
}
.rec-sub {
  font-size: 11px;
  color: var(--muted);
  margin-top: 1px;
  line-height: 1.45;
}
.rec-del {
  width: 32px; height: 32px; flex: none;
  border-radius: 9px;
  display: grid; place-items: center;
  color: var(--muted-2);
  border: 1px solid transparent;
  transition: all .16s var(--ease);
}
.rec-del:hover {
  color: var(--bad);
  background: var(--bad-soft);
  border-color: color-mix(in srgb, var(--bad) 20%, transparent);
}
.rec-del:active { transform: scale(.92); }
.rec-del .ico { width: 16px; height: 16px; }

/* ------------------------------ 分析 ------------------------------ */
.hero { display: flex; align-items: center; gap: 15px; }
.ring { position: relative; width: 100px; height: 100px; flex: none; }
.ring svg { width: 100%; height: 100%; }
.ring .ring-txt {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  text-align: center;
}
.ring .ring-txt b {
  font-size: 26px;
  font-weight: 820;
  letter-spacing: -1.2px;
  line-height: 1;
  display: block;
}
.ring .ring-txt span { font-size: 10px; color: var(--muted); font-weight: 650; display: block; margin-top: 1px; }
.hero-main { min-width: 0; flex: 1; }
.hero-title {
  font-size: 16px;
  font-weight: 750;
  letter-spacing: -.3px;
  line-height: 1.35;
}
.hero-desc { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.55; }

/* 诊断条目 */
.diag { display: grid; gap: 7px; }
.diag-item {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 11px 12px;
  border-radius: var(--r);
  background: var(--card-2);
  border: 1px solid var(--line-2);
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--ink-2);
  transition: border-color .18s var(--ease), background .18s var(--ease);
}
.diag-item:hover { background: var(--card); border-color: var(--line); }
.diag-item .di {
  font-size: 13px;
  line-height: 1.5;
  flex: none;
  width: 20px; height: 20px;
  display: grid; place-items: center;
  border-radius: 7px;
  background: color-mix(in srgb, var(--brand) 12%, transparent);
  color: var(--brand);
}
.diag-item b { color: var(--ink); font-weight: 700; }
.diag-item.bad .di { background: var(--bad-soft); color: var(--bad); }
.diag-item.warn .di { background: var(--warn-soft); color: var(--warn); }
.diag-item.good .di { background: var(--ok-soft); color: var(--ok); }

/* 提分路径 */
.plan-list { display: grid; gap: 8px; }
.plan-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 12px;
  border-radius: var(--r);
  background: var(--card-2);
  border: 1px solid var(--line-2);
  transition: border-color .18s var(--ease), background .18s var(--ease), transform .18s var(--ease);
}
.plan-item:hover { background: var(--card); border-color: var(--line); }
.plan-n {
  width: 23px; height: 23px;
  border-radius: 8px;
  flex: none;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--brand) 12%, transparent);
  color: var(--brand-ink);
  font-size: 11.5px;
  font-weight: 800;
}
.plan-main { flex: 1; min-width: 0; }
.plan-title { font-size: 12.5px; font-weight: 680; line-height: 1.4; }
.plan-sub { font-size: 11px; color: var(--muted); margin-top: 1px; line-height: 1.45; }
.plan-gain {
  font-size: 13px;
  font-weight: 800;
  color: var(--ok);
  flex: none;
  letter-spacing: -.3px;
}

/* 建议列表 */
.advice { display: grid; gap: 6px; }
.advice li {
  position: relative;
  padding-left: 15px;
  font-size: 12.5px;
  line-height: 1.62;
  color: var(--ink-2);
}
.advice li::before {
  content: "";
  position: absolute;
  left: 3px; top: .62em;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--tone, var(--brand));
  opacity: .7;
}

/* 折叠 */
details.acc {
  border-top: 1px solid var(--line-2);
  padding-top: 9px;
  margin-top: 9px;
}
details.acc > summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 2px 0;
  font-size: 12.5px;
  font-weight: 680;
  color: var(--ink-2);
  border-radius: 8px;
  transition: color .16s var(--ease);
}
details.acc > summary:hover { color: var(--brand); }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary .caret {
  margin-left: auto;
  width: 16px; height: 16px;
  flex: none;
  color: var(--muted);
  transition: transform .22s var(--ease);
}
details.acc[open] > summary .caret { transform: rotate(180deg); }
details.acc .acc-body { padding-top: 8px; animation: accIn .22s var(--ease-out) both; }
@keyframes accIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* ------------------------------ 表格 ------------------------------ */
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th, .tbl td { padding: 8px 5px; text-align: right; border-bottom: 1px solid var(--line-2); }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl thead th {
  font-size: 10.5px;
  color: var(--muted);
  font-weight: 650;
  letter-spacing: .2px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 7px;
}
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr { transition: background .16s var(--ease); }
.tbl tbody tr:hover { background: var(--card-2); }
.tbl td.acc { font-weight: 750; }
.tbl .muted { color: var(--muted); font-weight: 500; }
.tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* ------------------------------ 表单 ------------------------------ */
.field { display: grid; gap: 6px; min-width: 0; }
.field > label { font-size: 12px; font-weight: 650; color: var(--ink-2); }
.input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 11px;
  border: 1.5px solid var(--line);
  background: var(--card-2);
  color: var(--ink);
  font: 500 14.5px/1.4 var(--font);
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease);
}
.input:focus {
  border-color: var(--brand);
  background: var(--card);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent);
}
.input::placeholder { color: var(--muted-2); }
.form-grid { display: grid; gap: 11px; }

/* ------------------------------ 空状态 ------------------------------ */
.empty {
  text-align: center;
  padding: 30px 20px;
  color: var(--muted);
}
.empty .em-ico {
  width: 56px; height: 56px;
  margin: 0 auto 12px;
  border-radius: 18px;
  display: grid; place-items: center;
  background: linear-gradient(150deg, color-mix(in srgb, var(--brand) 14%, transparent), color-mix(in srgb, var(--brand-2) 10%, transparent));
  color: var(--brand);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4);
}
.empty .em-ico .ico { width: 26px; height: 26px; }
.empty h3 { font-size: 14.5px; font-weight: 750; color: var(--ink); margin-bottom: 5px; }
.empty p { font-size: 12.5px; line-height: 1.65; max-width: 320px; margin: 0 auto; }
.empty .btn-row { margin-top: 16px; max-width: 340px; margin-left: auto; margin-right: auto; }

/* ------------------------------ 底部导航 ------------------------------ */
.tabbar {
  position: fixed;
  left: 50%;
  bottom: calc(9px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 50;
  width: min(calc(100% - 20px), 430px);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
  padding: 5px;
  border-radius: 18px;
  background: color-mix(in srgb, var(--card) 86%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border: 1px solid var(--line);
  box-shadow: var(--sh-pop);
}
.tab {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 7px 4px 6px;
  border-radius: 13px;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 650;
  transition: color .22s var(--ease), background .22s var(--ease), transform .16s var(--ease);
}
.tab .ico { width: 20px; height: 20px; transition: transform .22s var(--ease-out); }
.tab:active { transform: scale(.95); }
.tab[aria-selected="true"] {
  color: #fff;
  background: linear-gradient(140deg, var(--brand), var(--brand-2));
  box-shadow: 0 8px 18px -9px var(--brand);
}
.tab[aria-selected="true"] .ico { transform: translateY(-1px) scale(1.04); }

/* ------------------------------ Toast ------------------------------ */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h) + 30px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 12px) scale(.96);
  z-index: 70;
  max-width: min(90vw, 400px);
  padding: 10px 15px;
  border-radius: 11px;
  background: color-mix(in srgb, var(--ink) 95%, transparent);
  color: #fff;
  font-size: 12.5px;
  font-weight: 650;
  box-shadow: var(--sh-pop);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s var(--ease), transform .22s var(--ease-out);
  text-align: center;
  display: flex;
  align-items: center;
  gap: 7px;
}
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.toast .ico { width: 16px; height: 16px; flex: none; }

/* ------------------------------ 说明文字 ------------------------------ */
.note {
  font-size: 11.5px;
  line-height: 1.7;
  color: var(--muted);
}
.note b { color: var(--ink-2); font-weight: 650; }
.note + .note { margin-top: 7px; }

/* ------------------------------ 网格布局 ------------------------------ */
/* 平板及以上：双栏 */
.grid-2 { display: grid; gap: var(--gap); }
.grid-2 > .span-2 { grid-column: 1 / -1; }

@media (min-width: 760px) {
  :root { --gap: 14px; --pad: 20px; }
  body { font-size: 15px; }
  .view { padding-bottom: calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px)); }
  .card { padding: 18px; border-radius: var(--r-lg); }
  .card.pad-sm { padding: 15px; }
  .brand-mark { width: 40px; height: 40px; font-size: 20px; border-radius: 12px; }
  .brand-text h1 { font-size: 18.5px; }
  .brand-text p { font-size: 11.5px; }
  .card-title { font-size: 14.5px; }
  .stat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .stat .v { font-size: 23px; }
  .hero-title { font-size: 18px; }
  .ring { width: 118px; height: 118px; }
  .ring .ring-txt b { font-size: 30px; }
  .preview { padding: 15px 18px; }
  .pv-score b { font-size: 38px; }
  .tabbar { width: 500px; }

  .grid-2 { grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); align-items: start; }
  .grid-2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .grid-2 > .col { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }

  /* 录入页：左录入 / 右预览（宽屏时预览变侧栏） */
  .entry-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: var(--gap); align-items: start; }
  .entry-side { position: sticky; top: calc(var(--topbar-h, 58px) + 12px); display: flex; flex-direction: column; gap: var(--gap); }
}

@media (min-width: 1080px) {
  :root { --gap: 16px; --pad: 24px; }
  .entry-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 380px); }
}

/* ------------------------------ 仪表盘 / 环形 / 侧栏 ------------------------------ */
.hero-card { padding-top: 15px; }

.gauge-slot {
  flex: none;
  display: grid;
  place-items: center;
  width: 132px;
}
.gauge-slot svg { width: 100%; height: auto; }

.gauge-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-top: 5px;
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
}

.donut-row {
  display: flex;
  align-items: center;
  gap: 14px;
}
.donut-wrap {
  flex: none;
  width: 46%;
  max-width: 150px;
}
.donut-legend {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 5px;
}
.dl-row {
  display: grid;
  grid-template-columns: 9px minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
}
.dl-row i { width: 9px; height: 9px; border-radius: 3px; }
.dl-name { color: var(--ink-2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dl-val { font-weight: 750; font-size: 12px; }
.dl-pct { color: var(--muted); font-weight: 600; font-size: 11px; min-width: 30px; text-align: right; }

.side-tip { display: none; }

.sec-meta {
  font-size: 11px;
  color: var(--muted);
  margin: -6px 0 8px;
  font-weight: 550;
}

.t-ico {
  width: 17px; height: 17px;
  flex: none;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 10px;
  font-weight: 800;
}
.t-ico.ok { background: var(--ok); color: #fff; }
.t-ico.warn { background: var(--warn); color: #1a1400; }
.t-ico.bad { background: var(--bad); color: #fff; }

/* 表单双列（宽屏） */
@media (min-width: 560px) {
  .form-grid.two { grid-template-columns: 1fr 1fr; }
}

      <span>记录</span>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/*!
 * model.js — 四级（CET-4）成绩赋分估算核心引擎
 * ------------------------------------------------------------------
 * 分值结构来源：《英语考试应试指南》第一章 第 3 问（官方试卷结构表）
 *   写作      1 题  15%
 *   听力      短篇新闻 7 题 7% / 长对话 8 题 8% / 听力篇章 10 题 20%   （共 25 题 35%）
 *   阅读      词汇理解 10 题 5% / 长篇阅读 10 题 10% / 仔细阅读 10 题 20%（共 30 题 35%）
 *   翻译      1 题  15%
 *   合计 57 题 / 100% / 125 分钟
 * 赋分规则：
 *   1) 各部分按官方"分值比例"折算为百分制原始分；写作、翻译按 15 分制（恰等于其 15 点百分制）；
 *   2) 百分制原始分 × 7.1 = 710 分制报道分（线性赋分参考值，710 / 100 = 7.1）；
 *   3) 官方报道分实为常模转换所得（常模均值 500、标准差 70），故额外给出正态近似的常模百分位；
 *   4) 官方规则：总分 220 分及以下记 0 分、不发放成绩报告单；425 分及以上达到"基本目标"。
 * ------------------------------------------------------------------
 * 本文件不依赖 DOM，可同时用于浏览器与 Node（测试）。
 */
(function (root) {
  'use strict';

  /* ============================== 常量 ============================== */

  var FULL_SCORE = 710;          // 报道总分满分
  var RAW_FULL = 100;            // 百分制加权原始分满分
  var POINT = FULL_SCORE / RAW_FULL;  // 7.1：百分制 1 分 = 报道分 7.1 分
  var PASS_LINE = 425;           // 官方"基本目标"线
  var REPORT_FLOOR = 220;        // 220 分及以下：官方记 0 分 / 不发成绩报告单
  var NORM_MEAN = 500;           // 常模均值
  var NORM_SD = 70;              // 常模标准差
  var SUBJECTIVE_FULL = 15;      // 写作 / 翻译 15 分制

  /* 官方五档总体印象评分（写作、翻译通用档位划分） */
  var TIERS = [
    { key: 't14', label: '14分档', min: 13, max: 15, anchor: 14 },
    { key: 't11', label: '11分档', min: 10, max: 12, anchor: 11 },
    { key: 't8',  label: '8分档',  min: 7,  max: 9,  anchor: 8  },
    { key: 't5',  label: '5分档',  min: 4,  max: 6,  anchor: 5  },
    { key: 't2',  label: '2分档',  min: 1,  max: 3,  anchor: 2  }
  ];

  /* 分数段（用于展示与建议分档，标签由 content.js 提供文案） */
  var BANDS = [
    { key: 'b_under', min: 0,   max: 424 },
    { key: 'b_pass',  min: 425, max: 499 },
    { key: 'b_fair',  min: 500, max: 549 },
    { key: 'b_good',  min: 550, max: 599 },
    { key: 'b_great', min: 600, max: 649 },
    { key: 'b_top',   min: 650, max: 710 }
  ];

  /* 试卷结构：客观题型按官方题量与每题分值比例（百分制）定义 */
  var SECTIONS = [
    {
      key: 'writing', label: '写作', short: '写作', ratio: 15, kind: 'subjective',
      tierType: 'writing', order: 1, minutes: 30,
      parts: [
        { key: 'writing', label: '短文写作', short: '作文', count: 1, perRatio: 15 }
      ]
    },
    {
      key: 'listening', label: '听力理解', short: '听力', ratio: 35, kind: 'objective',
      order: 2, minutes: 25,
      parts: [
        { key: 'news',     label: '短篇新闻', short: '新闻',   count: 7,  perRatio: 1, tip: '3 篇新闻：前两篇各 2 题，第三篇 3 题' },
        { key: 'longconv', label: '长对话',   short: '长对话', count: 8,  perRatio: 1, tip: '2 篇长对话，每篇各 4 题' },
        { key: 'passage',  label: '听力篇章', short: '篇章',   count: 10, perRatio: 2, tip: '3 篇短文：4+3+3 题，每题分值最高' }
      ]
    },
    {
      key: 'reading', label: '阅读理解', short: '阅读', ratio: 35, kind: 'objective',
      order: 3, minutes: 40,
      parts: [
        { key: 'banked',   label: '词汇理解（选词填空）', short: '选词', count: 10, perRatio: 0.5, tip: '1 篇 200~250 词短文，10 空、15 备选词' },
        { key: 'matching', label: '长篇阅读（段落匹配）', short: '匹配', count: 10, perRatio: 1,   tip: '约 1000 词长文，10 句信息匹配' },
        { key: 'careful',  label: '仔细阅读', short: '仔细', count: 10, perRatio: 2,   tip: '2 篇 300~350 词短文，每篇 5 题' }
      ]
    },
    {
      key: 'translation', label: '翻译', short: '翻译', ratio: 15, kind: 'subjective',
      tierType: 'translation', order: 4, minutes: 30,
      parts: [
        { key: 'translation', label: '汉译英段落翻译', short: '翻译', count: 1, perRatio: 15 }
      ]
    }
  ];

  var SECTION_MAP = {};
  var PART_LIST = [];   // 全部客观题小项（6 个）
  var PART_MAP = {};
  SECTIONS.forEach(function (sec) {
    SECTION_MAP[sec.key] = sec;
    sec.reportMax = round1(sec.ratio * POINT);
    sec.rawMax = sec.ratio;
    sec.parts.forEach(function (part) {
      part.section = sec.key;
      part.sectionLabel = sec.label;
      part.rawMax = round2(part.count * part.perRatio);
      part.reportMax = round1(part.count * part.perRatio * POINT);
      part.perItem = part.perRatio * POINT;          // 每答对 1 题 ≈ 报道分
      PART_MAP[part.key] = part;
      if (sec.kind === 'objective') PART_LIST.push(part);
    });
  });

  /* ============================== 工具 ============================== */

  function clamp(n, lo, hi) {
    n = Number(n);
    if (!isFinite(n)) return 0;
    return Math.min(hi, Math.max(lo, n));
  }
  function clampInt(n, lo, hi) {
    return Math.round(clamp(n, lo, hi));
  }
  function round1(n) { return Math.round((Number(n) || 0) * 10) / 10; }
  function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
  function round0(n) { return Math.round(Number(n) || 0); }

  /** 误差函数（Abramowitz & Stegun 7.1.26，绝对误差 < 1.5e-7） */
  function erf(x) {
    var sign = x < 0 ? -1 : 1;
    x = Math.abs(x);
    var a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741,
        a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
    var t = 1 / (1 + p * x);
    var y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
    return sign * y;
  }

  /** 标准正态分布 CDF */
  function normalCdf(z) {
    return 0.5 * (1 + erf(z / Math.SQRT2));
  }

  /** 报道分 → 常模百分位（0~100，正态近似） */
  function percentileOf(reportScore, mean, sd) {
    mean = mean == null ? NORM_MEAN : mean;
    sd = sd == null ? NORM_SD : sd;
    var p = normalCdf((Number(reportScore) - mean) / sd) * 100;
    return Math.min(100, Math.max(0, round1(p)));
  }

  /** 报道分 → 分数段 */
  function bandOf(reportScore) {
    var s = Number(reportScore) || 0;
    for (var i = 0; i < BANDS.length; i++) {
      if (s >= BANDS[i].min && s <= BANDS[i].max) return BANDS[i];
    }
    return s < 0 ? BANDS[0] : BANDS[BANDS.length - 1];
  }

  /** 15 分制得分 → 档位 */
  function tierOf(score) {
    var s = clamp(score, 0, SUBJECTIVE_FULL);
    if (s >= 13) return TIERS[0];
    if (s >= 10) return TIERS[1];
    if (s >= 7) return TIERS[2];
    if (s >= 4) return TIERS[3];
    if (s >= 1) return TIERS[4];
    return { key: 't0', label: '0 分', min: 0, max: 0, anchor: 0 };
  }

  /** 正确率 → 状态（用于 UI 与诊断） */
  function statusOf(accuracy) {
    if (accuracy >= 0.85) return 'strong';
    if (accuracy >= 0.7) return 'ok';
    if (accuracy >= 0.55) return 'weak';
    return 'poor';
  }

  /* ============================== 赋分 ============================== */

  /**
   * 计算一次成绩
   * @param {Object} input
   * @param {'items'|'report'} [input.mode] 录入方式
   * @param {Object} [input.parts] {news,longconv,passage,banked,matching,careful} 答对题数
   * @param {Object} [input.subjective] {writing,translation} 15 分制自评
   * @param {Object} [input.report] {listening,reading,writing,translation} 已知报道分
   * @param {string} [input.date] 录入时间（ISO 字符串）
   * @param {string} [input.note]
   * @returns {Object} 结果快照
   */
  function score(input) {
    input = input || {};
    var mode = input.mode === 'report' ? 'report' : 'items';
    var warnings = [];
    var partsIn = input.parts || {};
    var subjIn = input.subjective || {};
    var reportIn = input.report || {};
    var sections = [];
    var rawTotal = 0;
    var reportTotal = 0;

    SECTIONS.forEach(function (sec) {
      var out = {
        key: sec.key,
        label: sec.label,
        short: sec.short,
        ratio: sec.ratio,
        kind: sec.kind,
        order: sec.order,
        rawMax: sec.rawMax,
        reportMax: sec.reportMax,
        parts: [],
        correct: null,
        derived: false
      };

      if (sec.kind === 'objective') {
        var raw = 0, correctSum = 0, itemCount = 0;
        sec.parts.forEach(function (part) {
          var c = clampInt(partsIn[part.key], 0, part.count);
          if (partsIn[part.key] != null && Number(partsIn[part.key]) > part.count) {
            warnings.push(part.label + ' 最多 ' + part.count + ' 题，已自动修正');
          } else if (partsIn[part.key] != null && Number(partsIn[part.key]) < 0) {
            warnings.push(part.label + ' 答对题数不能为负，已按 0 计');
          }
          var pr = c * part.perRatio;
          correctSum += c;
          itemCount += part.count;
          raw += pr;
          var partOut = {
            key: part.key,
            label: part.label,
            short: part.short,
            section: sec.key,
            sectionLabel: sec.label,
            count: part.count,
            correct: c,
            wrong: part.count - c,
            accuracy: round1(c / part.count * 100),
            raw: round2(pr),
            rawMax: part.rawMax,
            report: round1(pr * POINT),
            reportMax: part.reportMax,
            perItem: round2(part.perItem),
            loss: round1((part.count - c) * part.perItem),
            status: statusOf(c / part.count),
            tip: part.tip
          };
          out.parts.push(partOut);
        });
        out.correct = correctSum;
        out.itemCount = itemCount;
        out.raw = round2(raw);
        out.accuracy = round1(raw / sec.ratio * 100);
        out.status = statusOf(raw / sec.ratio);
      } else {
        var sc = clamp(Number(subjIn[sec.key]) || 0, 0, SUBJECTIVE_FULL);
        if (mode === 'items') sc = Math.round(sc);
        if (subjIn[sec.key] != null && (Number(subjIn[sec.key]) > SUBJECTIVE_FULL || Number(subjIn[sec.key]) < 0)) {
          warnings.push(sec.label + '按 15 分制评分（0~15），已自动修正为 ' + sc + ' 分');
        }
        var tier = tierOf(sc);
        out.raw = round2(sc);
        out.accuracy = round1(sc / SUBJECTIVE_FULL * 100);
        out.status = statusOf(sc / SUBJECTIVE_FULL);
        out.tier = { key: tier.key, label: tier.label, min: tier.min, max: tier.max };
        out.parts.push({
          key: sec.key,
          label: sec.parts[0].label,
          short: sec.parts[0].short,
          section: sec.key,
          sectionLabel: sec.label,
          count: 1,
          correct: null,
          accuracy: out.accuracy,
          raw: round2(sc),
          rawMax: SUBJECTIVE_FULL,
          report: round1(sc * POINT),
          reportMax: sec.reportMax,
          perItem: round2(POINT),
          loss: round1(sec.reportMax - sc * POINT),
          status: out.status,
          tier: out.tier
        });
      }

      if (mode === 'report') {
        var given = clamp(Number(reportIn[sec.key]), 0, sec.reportMax);
        if (reportIn[sec.key] != null && Number(reportIn[sec.key]) > sec.reportMax) {
          warnings.push(sec.label + '报道分最高 ' + sec.reportMax + '，已自动修正');
        }
        out.report = round1(given);
        out.raw = round2(given / POINT);      // 由报道分反推的百分制等效分
        out.derived = true;
        out.accuracy = round1(out.raw / sec.ratio * 100);
        out.status = statusOf(out.raw / sec.ratio);
        out.parts.forEach(function (p) {
          p.report = round1(p.report);          // 保留录入时的分项（若为 0 则无参考意义）
          p.derived = true;
        });
      } else {
        out.report = round1(out.raw * POINT);
      }

      out.gap = round1(sec.reportMax - out.report);        // 距满分失分
      out.rate = round1(out.report / sec.reportMax * 100);  // 得分率

      rawTotal += out.raw;
      reportTotal += out.report;
      sections.push(out);
    });

    var total = round1(reportTotal);
    var totalInt = round0(total);
    var percentile = percentileOf(total);
    var band = bandOf(total);
    var zeroed = totalInt <= REPORT_FLOOR;

    return {
      mode: mode,
      date: input.date || new Date().toISOString(),
      note: String(input.note == null ? '' : input.note).slice(0, 120),
      sections: sections,
      rawTotal: round2(rawTotal),
      total: total,
      totalInt: totalInt,
      percentile: percentile,
      bandKey: band.key,
      bandRange: [band.min, band.max],
      passLine: PASS_LINE,
      passGap: round1(PASS_LINE - total),
      passReached: totalInt >= PASS_LINE,
      zeroed: zeroed,
      lossTotal: round1(FULL_SCORE - total),
      warnings: warnings
    };
  }

  /** 便捷：由"答对题数"直接计算（不含写作/翻译时按 0 计） */
  function scoreByItems(parts, subjective) {
    return score({ mode: 'items', parts: parts || {}, subjective: subjective || {} });
  }

  /** 由各板块报道分直接计算 */
  function scoreByReport(report) {
    return score({ mode: 'report', report: report || {} });
  }

  /** 目标达成所需报道分差 */
  function gapToTarget(total, target) {
    var t = Number(target) || PASS_LINE;
    return round1(t - (Number(total) || 0));
  }

  /**
   * 提分路径：给定当前各小项正确数与每题收益，求达成目标需要"多对几题"
   * @param {Object} result score() 结果
   * @param {number} target 目标总分
   * @param {'roi'|'loss'|'balanced'} [strategy]
   */
  function improvementPlan(result, target, strategy) {
    strategy = strategy || 'roi';
    var need = gapToTarget(result.total, target);
    var objective = [];
    result.sections.forEach(function (sec) {
      if (sec.kind !== 'objective') return;
      sec.parts.forEach(function (p) {
        objective.push({
          key: p.key,
          label: p.label,
          short: p.short,
          sectionLabel: p.sectionLabel,
          perItem: p.perItem,
          room: p.count - p.correct,        // 还能多对的题数
          accuracy: p.accuracy,
          loss: p.loss
        });
      });
    });

    if (need <= 0) {
      return { needed: 0, strategy: strategy, feasible: true, items: [], message: '目标已达成，保持节奏并冲击更高分数。' };
    }

    var pool = objective.slice();
    if (strategy === 'loss') {
      pool.sort(function (a, b) { return b.loss - a.loss || b.perItem - a.perItem; });
    } else if (strategy === 'balanced') {
      // 先照顾得分率低的题型（边际提升空间大），再按单位收益排序
      pool.sort(function (a, b) { return a.accuracy - b.accuracy || b.perItem - a.perItem; });
    } else {
      pool.sort(function (a, b) { return b.perItem - a.perItem || a.accuracy - b.accuracy; });
    }

    var items = [];
    var remain = need;
    for (var i = 0; i < pool.length && remain > 0; i++) {
      var p = pool[i];
      if (p.room <= 0) continue;
      var n = Math.min(p.room, Math.ceil(remain / p.perItem - 1e-9));
      if (n <= 0) continue;
      var gain = round1(n * p.perItem);
      items.push({
        key: p.key, label: p.label, short: p.short, sectionLabel: p.sectionLabel,
        count: n, perItem: round2(p.perItem), gain: gain,

        '<div class="part-top" style="align-items:center">' +
        '<div class="part-meta">15 分制自评 · ' + sec.ratio + '% 分值 · 满分 ' + sec.reportMax + ' 分</div>' +
        '<div class="part-score"><b data-sub-out="' + key + '">' + val + '</b><span> / 15 · ≈ ' + fmt1(val * M.POINT) + ' 分</span></div>' +
        '</div>' +
        '<input class="range" type="range" min="0" max="15" step="1" value="' + val + '" data-range="' + key + '" ' +
        'style="--tone:var(--c-' + key + ');--fill:' + (val / 15 * 100) + '%" aria-label="' + esc(sec.label) + '自评分数">' +
        '<div class="chips" style="margin-top:8px">' +

        }).join('') +
        '</div>' +
        '<div class="note" style="margin-top:9px" data-tier-desc="' + key + '">' + esc(cTier ? cTier.desc : '') + '</div>' +

        '<div class="acc-body"><table class="tbl"><tbody>' +

          return '<tr><td style="font-weight:700;white-space:nowrap">' + esc(t.label) + '</td><td style="text-align:left;color:var(--muted)">' + esc(t.desc) + '</td></tr>';
        }).join('') +
        '</tbody></table></div></details>' +
        '</section>';

    /* 元信息 */
    html += '<section class="card">' +
      '<div class="card-head"><div class="card-title">' + icon('clock') + '时间与备注</div></div>' +
      '<div class="form-grid two">' +
      '<div class="field"><label for="inDate">考试 / 模考时间</label>' +

      '</div></section>';

    html += '<div class="btn-row">' +
      '<button class="btn btn-ghost" data-act="clear-draft">清空重填</button>' +
      '<button class="btn btn-primary" data-act="save">' + icon('check') + '保存并分析</button>' +

    html += '</div>';

    /* 右栏：实时预览（宽屏吸顶侧栏，手机端浮动底部） */
    html += '<div class="entry-side"><div id="previewRoot"></div>' +
      '<div class="side-tip card pad-sm" id="sideTip"></div></div>';

    html += '</div>';
    return html;
  }
  function partRow(part, d) {
    var val = Number(d.parts[part.key]) || 0;
    var report = fmt1(val * part.perItem);
    var rate = part.count ? Math.round(val / part.count * 100) : 0;
    return '<div class="part tone-' + part.section + '" data-part-row="' + part.key + '">' +
      '<div class="part-top">' +
      '<div><div class="part-name">' + esc(part.label) +
      (part.perRatio >= 2 ? '<span class="badge weak">高分题</span>' : '') + '</div>' +
      '<div class="part-meta">共 ' + part.count + ' 题 · 每题 ' + part.perRatio + '% · ≈ ' + fmt1(part.perItem) + ' 分/题</div></div>' +
      '<div class="part-score"><b data-out-part="' + part.key + '">' + report + '</b><span> 分</span>' +
      '<div class="part-meta" style="margin-top:1px">原始 <i data-out-raw="' + part.key + '">' + fmt1(val * part.perRatio * 10) / 10 + '</i>/' + part.rawMax + '</div></div>' +
      '</div>' +
      '<div class="stepper">' +
      '<button class="step-btn" data-act="step" data-part="' + part.key + '" data-delta="-1" aria-label="减少">−</button>' +
      '<div class="step-val"><input type="number" inputmode="numeric" min="0" max="' + part.count + '" value="' + val +
      '" data-num="' + part.key + '" aria-label="' + esc(part.label) + '答对题数"><span class="of">/ ' + part.count + '</span></div>' +
      '<button class="step-btn" data-act="step" data-part="' + part.key + '" data-delta="1" aria-label="增加">+</button>' +
      '</div>' +
      '<div class="track thin" style="--tone:var(--c-' + part.section + ')"><i data-fill="' + part.key + '" style="width:' + rate + '%"></i></div>' +
      '</div>';
  }

  function previewHtml() {
    var r = draftResult();
    var band = A.bandContent(r.bandKey);
    var tp = A.targetProgress(r, state.target);
    var bars = r.sections.map(function (s) {
      return '<div class="pv-bar"><div class="lbl"><span>' + esc(s.short) + '</span><b>' + fmt1(s.report) + '</b></div>' +
        '<div class="t"><i style="width:' + fmt1(s.rate) + '%"></i></div></div>';
    }).join('');
    return '<div class="preview" id="preview">' +
      '<div class="preview-top">' +
      '<div><div class="pv-label">实时估分</div>' +
      '<div class="pv-score"><b data-pv-score>' + fmtInt(r.total) + '</b><span>/ 710</span></div>' +
      '<div class="pv-label" style="margin-top:2px;opacity:.72">原始分 ' + fmt1(r.rawTotal) + ' / 100</div></div>' +
      '<div class="pv-right"><div class="pv-badge">' + esc(band.label) + '</div>' +
      '<div class="pv-label" style="margin-top:5px">' +
      (tp.reached ? '超目标 ' + (Math.round(r.total) - tp.target) + ' 分' : '距 ' + tp.target + ' 差 ' + tp.gap) + '</div></div>' +
      '</div>' +
      '<div class="pv-bars">' + bars + '</div>' +
      (r.zeroed ? '<div class="pv-label" style="margin-top:8px;opacity:.92">⚠ 总分 ≤ 220 分官方记 0 分</div>' : '') +
      '</div>';
  }

  /* 局部更新预览：避免整块重建造成闪烁 */
  function patchPreview() {
    var root = $('#previewRoot');
    if (!root) return;
    var pv = root.querySelector('#preview');
    if (!pv) { root.innerHTML = previewHtml(); updateEntryOutputs(); renderSideTip(); return; }

    var r = draftResult();
    var band = A.bandContent(r.bandKey);
    var tp = A.targetProgress(r, state.target);

    var scoreEl = pv.querySelector('[data-pv-score]');
    if (scoreEl) {
      var next = String(fmtInt(r.total));
      if (scoreEl.textContent !== next) {
        scoreEl.textContent = next;
        scoreEl.classList.remove('bump');
        void scoreEl.offsetWidth;
        scoreEl.classList.add('bump');
      }
    }
    var badge = pv.querySelector('.pv-badge');
    if (badge) badge.textContent = band.label;
    var right = pv.querySelector('.pv-right .pv-label');
    if (right) {
      right.textContent = tp.reached
        ? '超目标 ' + (Math.round(r.total) - tp.target) + ' 分'
        : '距 ' + tp.target + ' 差 ' + tp.gap;
    }
    var bars = pv.querySelectorAll('.pv-bar');
    r.sections.forEach(function (s, i) {
      var bar = bars[i];
      if (!bar) return;
      var val = bar.querySelector('.lbl b');
      if (val) val.textContent = fmt1(s.report);
      var fill = bar.querySelector('.t > i');
      if (fill) fill.style.width = fmt1(s.rate) + '%';
    });
    updateEntryOutputs();
    renderSideTip();
  }

  function renderSideTip() {
    var tip = $('#sideTip');
    if (!tip) return;
    var r = draftResult();
    var an = A.analyze(r, { target: state.target, weeks: state.weeks });
    var items = an.diagnoses.slice(0, 3).map(function (d) {
      return '<li>' + esc(d.title) + '</li>';
    }).join('');
    tip.innerHTML = '<div class="card-head tight"><div class="card-title">' + icon('spark') + '即时提示</div></div>' +
      '<ul class="advice">' + items + '</ul>';
  }

  function refreshPreview() {
    patchPreview();
  }

  function updateEntryOutputs() {
    var r = draftResult();
    r.sections.forEach(function (sec) {
      var out = $('[data-sec-out="' + sec.key + '"]');
      if (out) out.textContent = fmt1(sec.report) + ' / ' + sec.reportMax;
      sec.parts.forEach(function (p) {
        var el = $('[data-out-part="' + p.key + '"]');
        if (el) el.textContent = fmt1(p.report);
        var raw = $('[data-out-raw="' + p.key + '"]');
        if (raw) raw.textContent = fmt1(p.raw);
        var fill = $('[data-fill="' + p.key + '"]');
        if (fill) fill.style.width = (p.count ? Math.round(p.correct / p.count * 100) : 0) + '%';
      });
    });
    ['writing', 'translation'].forEach(function (key) {
      var sec = r.sections.filter(function (s) { return s.key === key; })[0];
      var tierOut = $('[data-tier-out="' + key + '"]');
      if (tierOut) {
        tierOut.textContent = sec.tier.label;
        tierOut.className = 'badge ' + (sec.raw >= 10 ? 'strong' : sec.raw >= 7 ? 'ok' : 'weak');
      }
      var subOut = $('[data-sub-out="' + key + '"]');
      if (subOut) {
        subOut.textContent = sec.raw;
        var sib = subOut.parentNode.querySelector('span');
        if (sib) sib.textContent = ' / 15 · ≈ ' + fmt1(sec.report) + ' 分';
      }
      var desc = $('[data-tier-desc="' + key + '"]');
      if (desc) {
        var tierContent = ((C.tiers || {})[M.SECTION_MAP[key].tierType] || []).filter(function (t) { return t.key === sec.tier.key; })[0];
        desc.textContent = tierContent ? tierContent.desc : '';
      }
    });
  }

  /* ============================== 视图：分析 ============================== */

  function viewAnalysis() {

      '<div class="hero">' +

      '<div class="ring-txt"><b>' + fmtInt(latest.total) + '</b><span>/ 710</span></div></div>' +

            '<div class="plan-gain">' + esc(s.gain) + '</div></div>';
        }).join('') + '</div>' +
        '<div class="note" style="margin-top:9px">' + esc(an.plan.message) + '</div>'

      sec.parts.forEach(function (part) {

      '<ul class="advice">' + an.actions.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>' +

      '</section>';

    return html;
  }

  /* ============================== 空状态 ============================== */

  function emptyState() {
    return '<div class="empty">' +
      '<div class="em-ico">' + icon('chart') + '</div>' +
      '<h3>还没有成绩记录</h3>' +
      '<p>录入一次四级模考或真题成绩，按官方分值结构折算 710 分制报道分，自动生成趋势图与针对性分析。</p>' +
      '<div class="btn-row">' +
      '<button class="btn btn-ghost" data-act="demo">载入示例</button>' +

  /* ============================== 渲染主流程 ============================== */

  function renderTopbar() {
    var list = allResults();
    var latest = list.length ? list[list.length - 1] : null;
    var meta = $('#topbarMeta');
    if (!meta) return;
    if (latest) {
      meta.innerHTML = '<span class="pill big ' + (latest.passReached ? 'pass' : 'fail') + '"><i class="dot"></i>' +
        fmtInt(latest.total) + ' 分</span>' +
        '<span class="pill">目标 ' + state.target + '</span>';
    } else {
      meta.innerHTML = '<span class="pill">目标 ' + state.target + '</span>';
    }

  function renderTabbar() {
    $$('#tabbar .tab').forEach(function (b) {
      b.setAttribute('aria-selected', String(b.getAttribute('data-view') === state.view));
    });
  }

  function renderView() {
    var view = $('#view');
    chartTasks = [];
    var html = state.view === 'home' ? viewHome()
      : state.view === 'entry' ? viewEntry()
        : state.view === 'analysis' ? viewAnalysis()
          : viewRecords();
    view.className = 'view view-' + state.view + (state.view === 'entry' ? ' has-preview' : '');
    view.innerHTML = html;
    renderTopbar();
    renderTabbar();
    syncTopbarHeight();

    /* 每次切页允许播放一次入场动画；同一次会话内不重复 */
    animateNext = true;

    if (state.view === 'home') afterHome();
    if (state.view === 'entry') afterEntry();
    if (state.view === 'analysis') afterAnalysis();
    if (state.view === 'records') afterRecords();
    animateNext = false;
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  /* 记录顶栏实际高度，供吸顶侧栏定位 */
  function syncTopbarHeight() {
    var tb = $('#topbar');
    if (!tb) return;
    document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight + 'px');
  }

  /* Y 轴整数刻度：0 起，用「好读」的步长（50/100/150/200），末位不足则追加而不是改写 */
  function scoreTicks(max) {
    max = max || 710;
    var candidates = [50, 100, 150, 200, 250];
    var step = 200;
    for (var i = 0; i < candidates.length; i++) {
      if (max / candidates[i] <= 5) { step = candidates[i]; break; }
    }
    var out = [];
    for (var v = 0; v <= max; v += step) out.push(v);
    if (out[out.length - 1] < max) out.push(max);
    return out;
  }

  function afterHome() {
    var list = allResults();
    if (!list.length) return;
    var latest = list[list.length - 1];
    var trends = M.trendStats(list);

    /* 仪表盘 */
    mountChart($('#gaugeSlot'), function (w) {
      var size = Math.min(176, Math.max(118, Math.round(w * 0.94)));
      return CHart.gauge({
        size: size, value: latest.total, max: 710,
        bands: [
          { from: 0, to: 220, color: 'var(--bad)' },
          { from: 220, to: 425, color: 'var(--warn)' },
          { from: 425, to: 550, color: 'var(--ok)' },
          { from: 550, to: 710, color: 'var(--brand)' }
        ],
        marks: [{ value: 425, label: '425' }],
        label: '估分', sub: '/ 710', aria: '估分仪表盘'
      });
    });

    /* 各部分得分 */
    mountChart($('#chartSections'), function (w) {
      return CHart.hbars({
        width: w, rows: latest.sections.map(function (s) {
          return { label: s.label, value: s.report, max: s.reportMax, color: sectionColor(s.key), sub: '得分率 ' + s.rate + '%' };
        }), rowH: 32, labelW: 52, rightW: 54, unit: '分', aria: '各部分得分'
      });
    });

    /* 得分贡献 */
    mountChart($('#chartDonut'), function (w) {
      var size = Math.min(150, Math.max(108, Math.round(w * 0.94)));
      return CHart.donut({
        size: size, thickness: Math.max(13, Math.round(size * 0.12)),
        segments: latest.sections.map(function (s) {
          return { value: s.report, color: sectionColor(s.key), label: s.label };
        }),
        centerTitle: fmtInt(latest.total), centerSub: '估分', gap: 2, aria: '得分贡献占比'
      });
    });
    var legendEl = $('#donutLegend');
    if (legendEl) {
      legendEl.innerHTML = latest.sections.map(function (s) {
        var pct = latest.total > 0 ? Math.round(s.report / latest.total * 100) : 0;
        return '<div class="dl-row"><i style="background:' + sectionColor(s.key) + '"></i>' +
          '<span class="dl-name">' + esc(s.short) + '</span>' +
          '<b class="dl-val">' + fmt1(s.report) + '</b>' +
          '<span class="dl-pct">' + pct + '%</span></div>';
      }).join('');
    }

    /* 趋势 */
    mountChart($('#chartTrend'), function (w) {
      var marks = [{ value: 425, label: '425 基本目标', color: '#f59e0b' }];
      if (state.target !== 425) marks.push({ value: state.target, label: '目标 ' + state.target, color: '#ef4444' });
      if (state.chartMode === 'total') {
        return CHart.line({
          width: w, height: 206,
          labels: list.map(function (r) { return shortDate(r.date); }),
          series: [{ key: 'total', name: '总分', color: 'var(--brand)', values: list.map(function (r) { return r.total; }) }],
          ticks: scoreTicks(710), yMin: 0, yMax: 710,
          marks: marks, unit: ' 分', aria: '总分趋势'
        });
      }
      return CHart.line({
        width: w, height: 222,
        labels: list.map(function (r) { return shortDate(r.date); }),
        series: M.SECTIONS.map(function (s, i) {
          return {
            key: s.key, name: s.label, color: sectionColor(s.key),
            values: list.map(function (r) { return r.sections[i].report; }),
            visible: state.seriesOn[s.key] !== false
          };
        }),
        ticks: [0, 50, 100, 150, 200, 250], yMin: 0, yMax: 250,
        unit: ' 分', area: false, showLast: false, aria: '分项趋势'
      });
    });

    /* 成绩构成 */
    mountChart($('#chartStack'), function (w) {
      return CHart.bar({
        width: w, height: 204,
        items: list.slice(-6).map(function (r) {
          return {
            label: shortDate(r.date), total: r.total,
            parts: r.sections.map(function (s) { return { value: s.report, color: sectionColor(s.key), label: s.label }; })
          };

  function afterEntry() {
    var root = $('#previewRoot');
    if (root) root.innerHTML = previewHtml();
    syncSteppers();
    renderSideTip();
    updateEntryOutputs();
  }

  function afterAnalysis() {
    var list = allResults();
    if (!list.length) return;

      var rows = an.rows.slice().sort(function (a, b) { return a.rate - b.rate; }).map(function (s) {
        return { label: s.label, value: s.rate, max: 100, color: sectionColor(s.key), sub: '失分 ' + s.loss + ' 分 / 满分 ' + s.max };
      });
      return CHart.hbars({ width: w, rows: rows, rowH: 34, labelW: 52, rightW: 46, unit: '%', aria: '各部分得分率' });

    if (!state.planKey) {
      state.planKey = state.weeks == null ? 'mid' : (state.weeks >= 10 ? 'long' : state.weeks >= 5 ? 'mid' : state.weeks >= 2 ? 'short' : 'sprint');

  function afterRecords() {
    var list = allResults();
    if (!list.length) return;
    mountChart($('#chartStackAll'), function (w) {
      return CHart.bar({
        width: w, height: 214,
        items: list.slice(-8).map(function (r) {
          return {
            label: shortDate(r.date), total: r.total,
            parts: r.sections.map(function (s) { return { value: s.report, color: sectionColor(s.key), label: s.label }; })
